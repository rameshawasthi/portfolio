name: Validate portfolio (no deployment)
on:
  pull_request:
    paths: ['index.html','README.md','assets/css/portfolio.css','assets/js/portfolio.js','assets/img/favicon.svg','scripts/validate-site.mjs','robots.txt','sitemap.xml','.github/workflows/validate-portfolio.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-site.mjs
